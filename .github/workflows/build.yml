name: Build and Release BTA

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/BTA.Windows/BTA.Windows.csproj

      - name: Publish
        run: dotnet publish src/BTA.Windows/BTA.Windows.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Zip publish folder
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath BTA-Windows.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: BTA-Windows.zip
