
name: Build BTA Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/BTA.Windows/BTA.Windows.csproj

      - name: Build
        run: dotnet build src/BTA.Windows/BTA.Windows.csproj -c Release

      - name: Publish
        run: dotnet publish src/BTA.Windows/BTA.Windows.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTA-Windows
          path: publish