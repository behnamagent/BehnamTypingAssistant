
name: Build BTA Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/BTA.Core/BTA.Core.csproj

      - name: Build
        run: dotnet build src/BTA.Core/BTA.Core.csproj --configuration Release